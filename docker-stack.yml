services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=devops_public"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/auth:/etc/traefik/auth:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        traefik.enable: "true"
        traefik.http.routers.traefik.rule: "Host(`traefik.localhost`)"
        traefik.http.routers.traefik.entrypoints: "websecure"
        traefik.http.routers.traefik.service: "api@internal"
        traefik.http.routers.traefik.middlewares: "secure@file,compress@file,traefik-auth@file"
        traefik.http.services.traefik-dummy.loadbalancer.server.port: "8080"

  frontend:
    image: devops-frontend:latest
    networks:
      - public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.10"
          memory: "128M"
      labels:
        traefik.enable: "true"
        traefik.http.routers.frontend.rule: "Host(`app.localhost`)"
        traefik.http.routers.frontend.entrypoints: "websecure"
        traefik.http.routers.frontend.middlewares: "secure@file,compress@file"
        traefik.http.services.frontend.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: devops-backend:latest
    env_file:
      - .env
    networks:
      - public
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
      labels:
        traefik.enable: "true"
        traefik.http.routers.backend.rule: "Host(`api.localhost`)"
        traefik.http.routers.backend.entrypoints: "websecure"
        traefik.http.routers.backend.middlewares: "secure@file,compress@file,api-ratelimit@file"
        traefik.http.services.backend.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.29
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
    networks:
      - public
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
      labels:
        traefik.enable: "true"
        traefik.http.routers.mailpit.rule: "Host(`mail.localhost`)"
        traefik.http.routers.mailpit.entrypoints: "websecure"
        traefik.http.services.mailpit.loadbalancer.server.port: "8025"
        traefik.http.routers.mailpit.middlewares: "secure@file,compress@file"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:5.4.2-standalone
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - public
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        traefik.enable: "true"
        traefik.http.routers.adminer.rule: "Host(`db.localhost`)"
        traefik.http.routers.adminer.entrypoints: "websecure"
        traefik.http.routers.adminer.middlewares: "secure@file,compress@file,adminer-auth@file"
        traefik.http.services.adminer.loadbalancer.server.port: "8080"

networks:
  public:
    name: devops_public
    driver: overlay
    attachable: true
  backend:
    name: devops_backend
    driver: overlay
    attachable: true

volumes:
  redis-data:
  postgres-data:
